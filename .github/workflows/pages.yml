name: Pages

# Publishes the website of the repository on GitHub Pages, https://madvintager.github.io/RomSieve/: the home page of
# site/ with the download buttons of a release, and the HTML user guide in guide/ (scripts/build-site.sh). The release
# workflow calls it once a version (never a prerelease) is published, so that the site shows the latest release, not
# the work in progress. A manual run publishes the guide of the ref given (a tag or a branch), or of the latest release
# when none is given. The home page and the scripts always come from the commit of this workflow, so that the guide of
# a version tagged before the site existed can still be published; the downloads are those of the tag given, or of the
# latest release for a branch.
# Settings > Pages must use the source "GitHub Actions", and the github-pages environment must allow the v* tags.
# The actions are pinned to a commit, with its version in a comment, as in the CI and release workflows.
on:
  workflow_call:
    inputs:
      ref:
        description: Tag or branch whose guide and downloads are published
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch whose guide is published (empty for the latest release)
        type: string
        required: false
        default: ''

permissions:
  contents: read

# One deployment at a time, and a deployment in progress is never cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - name: Choose the version
        id: ref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
        run: |
          # gh release view without a tag gives the latest release, never a draft or a prerelease
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ -z "$REF" ]; then
            REF="$latest"
          fi
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            version="${REF#v}"
          else
            version="${latest#v}"
          fi
          echo "Guide of $REF, downloads of $version"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout the home page
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout the guide
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: guide-source

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build the website and check its links
        shell: bash
        run: |
          bash guide-source/scripts/build-docs.sh "$RUNNER_TEMP/guide"
          DOCS_HTML_DIR="$RUNNER_TEMP/guide" bash scripts/build-site.sh dist/site "${{ steps.ref.outputs.version }}"

      - name: Keep the site for the deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
